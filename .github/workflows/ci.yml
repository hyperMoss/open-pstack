name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun run test
      - name: Typecheck
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun run typecheck
      - name: Install repository verifier
        working-directory: .claude/skills/verify-open-pstack
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check repository verifier
        working-directory: .claude/skills/verify-open-pstack
        run: |
          bun run test
          bun run typecheck
      - name: Test fork maintenance
        run: python3 tests/test-fork-maintenance.py
      - name: Test session-start hook
        run: python3 tests/test-session-start.py
      - name: Check documentation
        run: |
          python3 tests/test-check-docs.py
          python3 scripts/check-docs.py
      - name: Check maintenance ledger
        run: |
          git fetch --no-tags https://github.com/cursor/plugins.git main:refs/remotes/maintenance/cursor
          python3 scripts/fork-maintenance.py check-ledger
      - name: Validate manifests and static invariants
        run: |
          bun -e 'for (const path of [".claude-plugin/marketplace.json", ".agents/plugins/marketplace.json", "plugins/pstack/.claude-plugin/plugin.json", "plugins/pstack/.codex-plugin/plugin.json"]) JSON.parse(await Bun.file(path).text())'
          PSTACK_STATIC_ONLY=1 bash tests/skill-collision-repro.sh
